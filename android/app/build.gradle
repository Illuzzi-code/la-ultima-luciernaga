def buildAsLibrary = project.hasProperty('BUILD_AS_LIBRARY')
def buildAsApplication = !buildAsLibrary
if (buildAsApplication) {
    apply plugin: 'com.android.application'
} else {
    apply plugin: 'com.android.library'
}

android {
    namespace "org.libsdl.app"
    compileSdkVersion 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        if (buildAsApplication) {
            applicationId "com.ericson.luciernaga"
        }
        minSdkVersion 21
        targetSdkVersion 35
        versionCode 1
        versionName "1.0"
        externalNativeBuild {
            ndkBuild {
                arguments "APP_PLATFORM=android-21"
                abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            // Firma de demostración: el APK se puede instalar directamente.
            signingConfig signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    applicationVariants.all { variant ->
        tasks["merge${variant.name.capitalize()}Assets"]
            .dependsOn("externalNativeBuild${variant.name.capitalize()}")
    }

    if (!project.hasProperty('EXCLUDE_NATIVE_LIBS')) {
        sourceSets.main {
            jniLibs.srcDir 'libs'
        }
        externalNativeBuild {
            ndkBuild {
                path 'jni/Android.mk'
            }
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    if (buildAsLibrary) {
        libraryVariants.all { variant ->
            variant.outputs.each { output ->
                def outputFile = output.outputFile
                if (outputFile != null && outputFile.name.endsWith(".aar")) {
                    def fileName = "org.libsdl.app.aar"
                    output.outputFile = new File(outputFile.parent, fileName)
                }
            }
        }
    }
}

// Los assets del juego viven en la raíz del proyecto, para compartirlos con PC.
// Se copian al APK bajo assets/... (el juego los abre como "assets/tiles.png").
def generatedAssets = layout.buildDirectory.dir("generated/gameAssets")
def syncGameAssets = tasks.register("syncGameAssets", Copy) {
    from rootProject.file("../assets")
    into generatedAssets.map { it.dir("assets") }
}
android.sourceSets.main.assets.srcDirs += generatedAssets.get().asFile
tasks.matching { it.name.startsWith("merge") && it.name.endsWith("Assets") }.configureEach {
    dependsOn(syncGameAssets)
}
tasks.matching { it.name.startsWith("lint") }.configureEach {
    dependsOn(syncGameAssets)
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
}
